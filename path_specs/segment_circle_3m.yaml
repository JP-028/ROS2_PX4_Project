name: segment_circle_3m
type: segment_path

description: Full 3 meter diameter circle as a generic arc segment.

motion_defaults:
  speed_m_s: 0.06
  max_speed_m_s: 0.24
  vertical_speed_m_s: 0.12

  command_frame: local

  kp_xy: 0.55
  kp_z: 0.35

  position_tolerance_m: 0.18
  segment_timeout_factor: 4.0
  corner_hold_s: 0.5
  finish_hold_s: 1.0

path:
  - arc:
      radius_m: 1.5
      angle_deg: 360
      direction: left
