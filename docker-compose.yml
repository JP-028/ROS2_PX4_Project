services:
  ros2-px4:
    build:
      context: .
      dockerfile: Dockerfile

    image: ros2_px4_project
    container_name: px4_ros2_container

    stdin_open: true
    tty: true

    working_dir: /home/user/ros2_ws

    environment:
      DISPLAY: host.docker.internal:0

    volumes:
      - ..:/home/user/ros2_ws

    command: bash
